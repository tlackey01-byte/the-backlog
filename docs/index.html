<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Backlog</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161c">
<!-- iOS ignores the web manifest for "Add to Home Screen" styling, so these are needed
     alongside it for a standalone (no Safari chrome) launch with a matching icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Backlog">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/base.css">
<style>
  .home { max-width: 1280px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
  .home-label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-faint); margin: 8px 0 10px;
  }
  .section-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .section-card {
    display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-l); padding: 18px; text-decoration: none; color: var(--text);
    transition: border-color .15s ease;
  }
  a.section-card:hover { border-color: var(--accent); }
  .section-card.coming-soon { opacity: .5; }
  .section-card-icon {
    width: 52px; height: 52px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); color: var(--accent);
  }
  .section-card.coming-soon .section-card-icon { color: var(--text-faint); }
  .section-card h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; margin: 0 0 6px; }
  .section-card-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--text-muted); }
  .section-card-stats b { color: var(--text); font-family: var(--font-mono); font-weight: 600; }
</style>
</head>
<body>
<div id="app" style="display:none">
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-header-row">
        <a class="app-brand" href=".">The Backlog</a>
        <div class="app-actions">
          <button type="button" class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
          <div class="app-menu" id="app-menu" hidden>
            <button type="button" id="menu-signout">Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="home">
    <div class="home-label">Your sections</div>
    <div class="section-grid" id="section-grid"></div>
  </main>
</div>
<script src="shared/nav.js" data-active="" data-root=""></script>
<script type="module">
  import { requireLogin, db, doc, onSnapshot, signOutUser } from "./shared/firebase-init.js";

  var gridEl = document.getElementById("section-grid");

  function fmt(n) {
    return n != null ? n.toLocaleString("en-US") : "—";
  }

  // The games section (docs/games/) writes a small `totals` summary into its state doc
  // whenever it loads or saves, so this page never has to load the game catalog just to
  // show a stat card. Totals read as "—" until that section has been visited once.
  // Cards come from the same SECTIONS list as the navigation (shared/nav.js), so enabling
  // a section there turns its "Coming soon" card into a live link here too.
  function renderCards(totals) {
    var t = totals || {};
    gridEl.innerHTML = window.BacklogNav.SECTIONS.map(function (s) {
      var icon = '<div class="section-card-icon">' + window.BacklogNav.icon(s.icon, 28) + "</div>";
      if (!s.enabled) {
        return '<div class="section-card coming-soon">' + icon +
          '<div><h2>' + s.label + '</h2><div class="section-card-stats"><span>Coming soon</span></div></div></div>';
      }
      var stats = s.key === "games"
        ? "<span><b>" + fmt(t.total) + "</b> total</span><span><b>" + fmt(t.owned) + "</b> owned</span><span><b>" + fmt(t.wishlist) + "</b> wishlist</span>"
        : "";
      return '<a class="section-card" href="' + s.href + '">' + icon +
        '<div><h2>' + s.label + '</h2><div class="section-card-stats">' + stats + "</div></div></a>";
    }).join("");
  }

  renderCards(null);

  var menuBtn = document.getElementById("menu-btn");
  var menuEl = document.getElementById("app-menu");
  menuBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    menuEl.hidden = !menuEl.hidden;
    menuBtn.setAttribute("aria-expanded", String(!menuEl.hidden));
  });
  document.addEventListener("click", function (e) {
    if (!menuEl.hidden && !menuEl.contains(e.target)) { menuEl.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
  });
  document.getElementById("menu-signout").addEventListener("click", function () {
    signOutUser().then(function () { location.reload(); });
  });

  requireLogin(document.body, function (user) {
    document.getElementById("app").style.display = "";
    var stateRef = doc(db, "users", user.uid, "state", "games");
    onSnapshot(stateRef, function (snap) {
      var data = snap.data();
      renderCards(data ? data.totals : null);
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/the-backlog/sw.js?v=1789764543', { scope: '/the-backlog/' });
    });
    // A service worker update normally needs two reloads to actually become visible: the
    // first is still served by the outgoing worker while the new one installs in the
    // background, and the new content only shows up once that new worker actually takes
    // over. This auto-reloads the page exactly once, right when that handoff happens, so
    // one manual refresh is enough to see a new deploy instead of two.
    var refreshedForNewWorker = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshedForNewWorker) return;
      refreshedForNewWorker = true;
      location.reload();
    });
  }
</script>
<script src="shared/pull-to-refresh.js"></script>
</body>
</html>
