  // ---- Backup export ----
  // Folds current state back into compact records (the shape build.py produces).
  function buildMergedRaw() {
    return GAMES.filter(function(g) { return !g.deleted; }).map(function(g) {
      var rec = { n: g.name, m: g.main, e: g.extra, c: g.completionist, o: g.owned, p: g.owned ? g.platforms : [], g: g.genres };
      if (g.progress && g.progress !== 'backlog') rec.pr = g.progress;
      var ph = has(playedOverrides, g.name) ? playedOverrides[g.name] : g.playedHoursDefault;
      if (ph != null) rec.ph = ph;
      if (g.cover) rec.cv = g.cover;
      if (g.developer) rec.dv = g.developer;
      // Which release it is, and where a site-added cover came from -- bake_added_games.py
      // carries these into the master file so the game's art can be rebuilt properly.
      if (g.hltbId) rec.h = g.hltbId;
      if (g.year) rec.y = g.year;
      if (g.coverSource) rec.cs = g.coverSource;
      if (g.sgdbId) rec.sgdbId = g.sgdbId;
      return rec;
    });
  }
  // Covers are separate files served from R2, so for a self-contained backup each URL is
  // fetched and inlined back as a data URI; site-added covers already are one. That means a
  // backup pulls ~26MB over the network -- the point is a file that restores without them.
  function inlineCovers(records) {
    return Promise.all(records.map(function(r) {
      if (!r.cv || r.cv.indexOf('data:') === 0) return r;
      return fetch(r.cv).then(function(res) { return res.blob(); }).then(function(blob) {
        return new Promise(function(resolve) {
          var fr = new FileReader();
          fr.onload = function() { r.cv = fr.result; resolve(r); };
          fr.onerror = function() { resolve(r); };
          fr.readAsDataURL(blob);
        });
      }).catch(function() { return r; });
    }));
  }
  function exportBackup() {
    var btn = document.getElementById('export-btn');
    btn.textContent = 'Preparing backup…';
    btn.disabled = true;
    inlineCovers(buildMergedRaw()).then(function(games) {
      var payload = JSON.stringify({ exportedAt: new Date().toISOString(), games: games }, null, 2);
      var url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = 'backlog-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }).finally(function() {
      btn.textContent = 'Export backup (.json)';
      btn.disabled = false;
      menuEl.hidden = true;
    });
  }
  document.getElementById('export-btn').addEventListener('click', exportBackup);

  // ---- Games added from the site ----
  // Live in Firestore (users/{uid}/addedGames, one doc per game, compact-record shape)
  // rather than the baked catalog, so they show up everywhere instantly with no rebuild.
  // Fed every snapshot ordered by addedAt, so ids come out the same on every device. A doc
  // whose name is already known is skipped -- that's what makes baking them into
  // master_games_final.json later (Source/bake_added_games.py) safe.
  function applyAddedGames(records) {
    var added = false;
    records.forEach(function(r) {
      if (!r || !r.n || gameByName[r.n]) return;
      var g = expandRecord(r, GAMES.length);
      GAMES.push(g);
      gameByName[g.name] = g;
      if (!g.deleted) g.genres.forEach(function(tag) { genreCounts[tag] = (genreCounts[tag] || 0) + 1; });
      added = true;
    });
    if (!added) return;
    rebuildGenreList();
    refreshStats();
    applyFilters();
    // A deep link (#game-N) to a site-added game can't resolve until this first arrives.
    if (getGameFromHash() && detailViewEl.hidden) route();
  }
  window.__applyAddedGames = applyAddedGames;

  // Worker that proxies HowLongToBeat + SteamGridDB (see worker/src/index.js).
  var PROXY_URL = 'https://backlog-proxy.tlackey01.workers.dev';

  function normName(s) {
    return String(s || '').toLowerCase().replace(/[™®©]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  }
  // "Doom (1993)" and "Doom" share a title; the year suffix is how a second release of the
  // same name is told apart in the list (every per-game setting is keyed by name).
  function titleKey(s) { return normName(String(s || '').replace(/\s*\((?:19|20)\d\d\)\s*$/, '')); }
  // The game in the list that IS this search result, or null. Matching by name alone called
  // the 1993 Doom "In your backlog" when only the 2016 one was, and then refused to add it.
  // Same HLTB id is the same game; both known and different is a different one; otherwise
  // the title decides, unless both years are known and differ (another release).
  function findExistingGame(r) {
    var key = titleKey(r.name), year = parseInt(r.year, 10) || null;
    for (var i = 0; i < GAMES.length; i++) {
      var g = GAMES[i];
      if (r.hltbId && g.hltbId) { if (String(g.hltbId) === String(r.hltbId)) return g; continue; }
      if (titleKey(g.name) !== key) continue;
      if (year && g.year && Math.abs(g.year - year) > 1) continue;
      return g;
    }
    return null;
  }
  // Another release of the same title already in the list (so the new one needs a year).
  function hasOtherRelease(r) {
    var key = titleKey(r.name);
    return GAMES.some(function(g) { return !g.deleted && titleKey(g.name) === key; });
  }
  function proxyFetch(path) {
    if (!window.__getIdToken) return Promise.reject(new Error('Not signed in yet'));
    return window.__getIdToken().then(function(token) {
      return fetch(PROXY_URL + path, { headers: { Authorization: 'Bearer ' + token } });
    }).then(function(res) {
      if (!res.ok) throw new Error('Lookup failed (' + res.status + ')');
      return res;
    });
  }
  // Flatten onto the placeholder color and cap width at 600px, WebP q65 -> data URI
  // (~55KB). 600 matches the hero files the cover refresh bakes, so a game added here looks
  // the same on the detail page as one from the master list; it doubles as the row
  // thumbnail until bake_added_games.py folds it in and gives it a proper two-tier pair.
  // Safari only learned canvas WebP in 14 -- older browsers silently hand back a PNG, which
  // would be enormous, so fall back to JPEG when the data URI isn't what was asked for.
  // Always comes out 2:3. The worker now also accepts SteamGridDB's 660x930 and 342x482 art
  // (about 0.71) when a game has no 600x900; that gets a light centre crop. Anything further
  // off sits whole on the placeholder colour rather than being cropped or stretched.
  function processCover(url) {
    return proxyFetch('/cover?url=' + encodeURIComponent(url))
      .then(function(res) { return res.blob(); })
      .then(function(blob) { return createImageBitmap(blob); })
      .then(function(bmp) {
        var w = Math.min(600, bmp.width);
        var h = Math.round(w * 1.5);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgb(24, 26, 33)';
        ctx.fillRect(0, 0, w, h);
        ctx.imageSmoothingQuality = 'high';
        var ratio = bmp.width / bmp.height;
        if (Math.abs(ratio - 2 / 3) / (2 / 3) <= 0.08) {
          var sw = ratio > 2 / 3 ? bmp.height * 2 / 3 : bmp.width, sh = ratio > 2 / 3 ? bmp.height : bmp.width * 1.5;
          ctx.drawImage(bmp, (bmp.width - sw) / 2, (bmp.height - sh) / 2, sw, sh, 0, 0, w, h);
        } else {
          var s = Math.min(w / bmp.width, h / bmp.height), dw = bmp.width * s, dh = bmp.height * s;
          ctx.drawImage(bmp, (w - dw) / 2, (h - dh) / 2, dw, dh);
        }
        var webp = canvas.toDataURL('image/webp', 0.65);
        return webp.indexOf('data:image/webp') === 0 ? webp : canvas.toDataURL('image/jpeg', 0.8);
      });
  }

  var addQueryEl = document.getElementById('add-game-query');
  var addStatusEl = document.getElementById('add-game-status');
  var addResultsEl = document.getElementById('add-game-results');
  var addSearchStepEl = document.getElementById('add-game-search-step');
  var addPreviewStepEl = document.getElementById('add-game-preview-step');
  var addResults = [];
  var addSearchSource = 'hltb';
  var addSearchTimer = null;
  var addSearchSeq = 0;
  var addPreview = null;   // { result, genres, coverData, steamAppId, loading, progress, platforms }

  function setAddStatus(text, isError) {
    addStatusEl.textContent = text || '';
    addStatusEl.classList.toggle('error', !!isError);
  }
  function showAddSearchStep() {
    addPreview = null;
    addPreviewStepEl.hidden = true;
    addPreviewStepEl.innerHTML = '';
    addSearchStepEl.hidden = false;
    addQueryEl.focus();
  }
  function openAddGameModal() {
    addQueryEl.value = '';
    addResults = [];
    addResultsEl.innerHTML = '';
    setAddStatus('');
    openSheet('add-game-modal');
    showAddSearchStep();
  }
  function closeAddGameModal() {
    closeSheet('add-game-modal');
    addSearchSeq++;   // drop any in-flight search/detail responses
    clearTimeout(addSearchTimer);
  }
  function fmtAddHours(n) { return n == null ? '--' : fmtHours(n) + 'h'; }
  function renderAddResults() {
    addResultsEl.innerHTML = addResults.map(function(r, i) {
      var existing = findExistingGame(r);
      var inBacklog = existing && !existing.deleted;
      var thumb = r.thumb
        ? '<img class="cover" src="' + escHtml(r.thumb) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
        : '<span class="cover cover-ph">' + escHtml(r.name.charAt(0).toUpperCase()) + '</span>';
      var meta = [r.year, r.developer].filter(Boolean).join(' · ');
      var hours = [r.main != null ? 'Main ' + fmtAddHours(r.main) : null, r.extra != null ? 'Extra ' + fmtAddHours(r.extra) : null,
        r.completionist != null ? '100% ' + fmtAddHours(r.completionist) : null].filter(Boolean).join(' · ');
      return '<li><button type="button" class="add-game-result" data-i="' + i + '"' + (inBacklog ? ' disabled' : '') + '>' + thumb +
        '<span class="add-game-result-text"><span class="add-game-result-name">' + escHtml(r.name) + '</span>' +
        (meta ? '<span class="add-game-result-meta">' + escHtml(meta) + '</span>' : '') +
        (inBacklog ? '<span class="in-backlog">' + icon('check', 14, 2.6) + 'In your backlog</span>' : (hours ? '<span class="add-game-result-hours">' + escHtml(hours) + '</span>' : '')) +
        '</span></button></li>';
    }).join('');
  }
  function runAddSearch() {
    var q = addQueryEl.value.trim();
    var seq = ++addSearchSeq;
    if (q.length < 3) { addResults = []; renderAddResults(); setAddStatus(''); return; }
    setAddStatus('Searching…');
    proxyFetch('/search?q=' + encodeURIComponent(q))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (seq !== addSearchSeq) return;
        addResults = data.results || [];
        addSearchSource = data.source;
        renderAddResults();
        if (!addResults.length) setAddStatus('No matches.');
        else if (data.source === 'sgdb') setAddStatus('HowLongToBeat is unavailable right now -- showing names only; you can enter hours yourself.', true);
        else setAddStatus('');
      })
      .catch(function(err) {
        if (seq !== addSearchSeq) return;
        setAddStatus(err.message || 'Search failed.', true);
      });
  }
  function renderAddPreview() {
    var p = addPreview, r = p.result;
    var cover = p.coverData ? '<img class="cover" src="' + p.coverData + '" alt="">'
      : '<span class="cover cover-ph" style="font-size:13px;font-family:var(--font-body);font-weight:500">' + (p.loading ? 'Loading…' : 'No cover') + '</span>';
    var hoursHtml = addSearchSource === 'sgdb'
      ? '<div class="card hltb add-hours">' + ['main', 'extra', 'completionist'].map(function(k, i) {
          return '<div><span class="lbl">' + ['Main', 'Main + extra', 'Completionist'][i] + '</span>' +
            '<input type="text" inputmode="decimal" data-hours="' + k + '" placeholder="hrs"></div>';
        }).join('') + '</div>'
      : '<div class="card hltb add-hours">' + [['Main story', r.main], ['Main + extra', r.extra], ['Completionist', r.completionist]].map(function(s) {
          return '<div><span class="num">' + fmtAddHours(s[1]) + '</span><span class="lbl">' + s[0] + '</span></div>';
        }).join('') + '</div>';
    var genres = p.loading ? '<span>Loading genres…</span>' : (p.genres.length ? p.genres.map(function(t) { return '<span>' + escHtml(t) + '</span>'; }).join('') : '<span>Genre unknown</span>');
    var statusChips = PROGRESS.map(function(s) { return fChip(s.label, p.progress === s.key, 'data-add-progress="' + s.key + '"', s.color); }).join('');
    var wish = p.platforms.indexOf('Wishlist') > -1;
    var platChips = fChip('Wishlist', wish, 'data-add-plat="Wishlist"', 'var(--wishlist)') +
      REAL_PLATFORMS.map(function(pl) { return fChip(pl.label, p.platforms.indexOf(pl.key) > -1, 'data-add-plat="' + pl.key + '"'); }).join('');
    addPreviewStepEl.innerHTML =
      '<div class="sheet-head" style="padding-left:8px"><button type="button" class="sort-btn" id="add-game-back" style="font-size:15px">' + icon('back', 20) + 'Results</button>' +
        '<button type="button" class="sheet-close" id="add-game-close-2" aria-label="Close">' + icon('x', 22) + '</button></div>' +
      '<div class="sheet-body">' +
        '<div class="add-preview-top">' + cover + '<div style="min-width:0">' +
          '<h4 class="add-preview-name">' + escHtml(hasOtherRelease(r) ? r.name + ' (' + (r.year || 'other release') + ')' : r.name) + '</h4>' +
          '<div class="add-game-result-meta">' + escHtml([r.developer, r.year].filter(Boolean).join(' · ')) + '</div>' +
          '<div class="genre-tags">' + genres + '</div></div></div>' +
        hoursHtml +
        '<div class="sheet-section"><span class="mono-label">Status</span><div class="chip-row">' + statusChips + '</div></div>' +
        '<div class="sheet-section"><span class="mono-label">Platform</span><div class="chip-row">' + platChips + '</div></div>' +
        '<div class="add-game-status" id="add-game-save-status"></div>' +
      '</div>' +
      '<div class="sheet-foot"><button type="button" class="btn-block" id="add-game-save"' + (p.loading ? ' disabled' : '') + '>Add to backlog</button></div>';
  }
  function openAddPreview(r) {
    var seq = addSearchSeq;
    addPreview = { result: r, genres: [], coverData: null, coverUrl: null, sgdbId: null, steamAppId: null, loading: true, progress: 'backlog', platforms: ['Wishlist'] };
    addSearchStepEl.hidden = true;
    addPreviewStepEl.hidden = false;
    renderAddPreview();
    var qs = r.hltbId ? 'hltbId=' + r.hltbId : 'sgdbId=' + r.sgdbId;
    proxyFetch('/details?' + qs + '&name=' + encodeURIComponent(r.name) + '&year=' + encodeURIComponent(r.year || ''))
      .then(function(res) { return res.json(); })
      .then(function(d) {
        if (seq !== addSearchSeq || !addPreview) return;
        addPreview.genres = d.genres || [];
        addPreview.steamAppId = d.steamAppId || null;
        addPreview.coverUrl = d.coverUrl || null;
        addPreview.sgdbId = d.sgdbId || null;
        return d.coverUrl ? processCover(d.coverUrl).catch(function() { return null; }) : null;
      })
      .then(function(coverData) {
        if (seq !== addSearchSeq || !addPreview) return;
        addPreview.coverData = coverData || null;
        addPreview.loading = false;
        renderAddPreview();
      })
      .catch(function(err) {
        if (seq !== addSearchSeq || !addPreview) return;
        addPreview.loading = false;
        renderAddPreview();
        document.getElementById('add-game-save-status').textContent = 'Couldn’t load genres/cover (' + (err.message || 'error') + ') -- you can still add it.';
      });
  }
  function saveAddedGame() {
    var p = addPreview;
    if (!p) return;
    var r = p.result;
    var saveBtn = document.getElementById('add-game-save');
    var statusEl = document.getElementById('add-game-save-status');
    var real = p.platforms.filter(function(x) { return x !== 'Wishlist'; });
    var hours = { main: r.main, extra: r.extra, completionist: r.completionist };
    Array.prototype.forEach.call(addPreviewStepEl.querySelectorAll('[data-hours]'), function(el) {
      var v = parseFloat(el.value);
      hours[el.getAttribute('data-hours')] = isNaN(v) ? null : v;
    });
    // Re-adding something already in the catalog but deleted: restore it with the chosen
    // settings instead of creating a duplicate.
    var existing = findExistingGame(r);
    if (existing) {
      if (!existing.deleted) { statusEl.textContent = 'Already in your backlog.'; return; }
      delete deletedNames[existing.name];
      existing.deleted = false;
      existing.genres.forEach(function(tag) { genreCounts[tag] = (genreCounts[tag] || 0) + 1; });
      progressOverrides[existing.name] = existing.progress = p.progress;
      existing.playedHours = effectivePlayed(p.progress, existing.playedHoursDefault, existing.name);
      setPlatforms(existing, real);   // saves state
      rebuildGenreList();
      refreshStats();
      applyFilters();
      closeAddGameModal();
      location.hash = 'game-' + existing.id;
      return;
    }
    // A second release of a title you already have is saved as "Name (year)", the same way
    // the catalog names them, so the two never share a name (and so never share settings).
    var name = r.name;
    if (hasOtherRelease(r)) name = r.name + ' (' + (r.year || 'other release') + ')';
    if (gameByName[name]) { statusEl.textContent = 'A game named "' + name + '" is already in your backlog.'; return; }
    var rec = { n: name, m: hours.main, e: hours.extra, c: hours.completionist, o: real.length > 0, p: real, g: p.genres };
    if (p.progress !== 'backlog') rec.pr = p.progress;
    if (p.coverData) rec.cv = p.coverData;
    if (r.developer) rec.dv = r.developer;
    rec.addedAt = new Date().toISOString();
    if (r.hltbId) rec.hltbId = r.hltbId;
    if (r.year) rec.y = parseInt(r.year, 10) || null;
    if (p.steamAppId) rec.steamAppId = p.steamAppId;
    // Where the cover came from, so bake_added_games.py can have refetch_covers.py rebuild it
    // as the usual two-tier pair (wide list image + hero) from the same source.
    if (p.coverUrl) rec.cs = p.coverUrl;
    if (p.sgdbId) rec.sgdbId = p.sgdbId;
    saveBtn.disabled = true;
    statusEl.textContent = 'Adding…';
    window.__addGameDoc(rec)
      .then(function() {
        // The snapshot listener usually beats this; applying locally too guarantees the
        // redirect below has the game to land on.
        applyAddedGames([rec]);
        closeAddGameModal();
        var g = gameByName[rec.n];
        if (g) location.hash = 'game-' + g.id;
      })
      .catch(function(err) {
        saveBtn.disabled = false;
        statusEl.textContent = 'Couldn’t save: ' + (err.message || err);
      });
  }
  document.getElementById('add-game-btn').addEventListener('click', openAddGameModal);
  addQueryEl.addEventListener('input', function() {
    clearTimeout(addSearchTimer);
    addSearchTimer = setTimeout(runAddSearch, 350);
  });
  document.getElementById('add-game-modal').addEventListener('click', function(e) {
    if (e.target.closest('#add-game-close') || e.target.closest('#add-game-close-2')) { closeAddGameModal(); return; }
    if (e.target.closest('#add-game-back')) { addSearchSeq++; showAddSearchStep(); return; }
    if (e.target.closest('#add-game-save')) { saveAddedGame(); return; }
    var pr = e.target.closest('[data-add-progress]');
    if (pr && addPreview) { addPreview.progress = pr.getAttribute('data-add-progress'); renderAddPreview(); return; }
    var pl = e.target.closest('[data-add-plat]');
    if (pl && addPreview) {
      var key = pl.getAttribute('data-add-plat');
      if (key === 'Wishlist') addPreview.platforms = ['Wishlist'];
      else {
        var next = addPreview.platforms.filter(function(x) { return x !== 'Wishlist'; });
        toggleIn(next, key);
        addPreview.platforms = next.length ? next : ['Wishlist'];
      }
      renderAddPreview();
      return;
    }
    var resultBtn = e.target.closest('.add-game-result');
    if (resultBtn && !resultBtn.disabled) openAddPreview(addResults[+resultBtn.getAttribute('data-i')]);
  });

  refreshStats();
  renderActiveChips();
  applyFilters();
  route();
})();
</script>

<script type="module">
  import { requireLogin, db, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy, signOutUser } from "../shared/firebase-init.js";
  document.getElementById("menu-signout").addEventListener("click", function () {
    signOutUser().then(function () { location.reload(); });
  });
  requireLogin(document.body, function (user) {
    document.getElementById("app").style.display = "";
    var stateRef = doc(db, "users", user.uid, "state", "games");
    // Called by saveState() in the classic script above, which owns the state shape.
    // Always a full overwrite (see the dotted-key comment near buildStateObject()).
    window.__cloudSaveState = function (stateObj) {
      var payload = Object.assign({}, stateObj, { updatedAt: new Date().toISOString() });
      return setDoc(stateRef, payload);
    };

    // Games added from the site (see applyAddedGames() in the classic script). One doc per
    // game so covers never bloat the state doc above, which is fully rewritten on every edit.
    var addedGamesCol = collection(db, "users", user.uid, "addedGames");
    window.__addGameDoc = function (rec) { return addDoc(addedGamesCol, rec); };
    // Firebase ID token for the backlog proxy Worker, which only answers this one user.
    window.__getIdToken = function () { return user.getIdToken(); };
    onSnapshot(query(addedGamesCol, orderBy("addedAt")), function (snap) {
      if (window.__applyAddedGames) window.__applyAddedGames(snap.docs.map(function (d) { return d.data(); }));
    });

    // Live cross-device sync: every snapshot (this device's own writes echoing back
    // included) is diffed and patched into the page by applyRemoteState(), never a full
    // reload. Also re-saves `totals` once per page load so the homepage card self-heals
    // after anything writes this doc without recomputing them.
    var seededTotals = false;
    onSnapshot(stateRef, function (snap) {
      var data = snap.data();
      if (window.__applyRemoteState) window.__applyRemoteState(data);
      if (!seededTotals) {
        seededTotals = true;
        if (window.saveState) window.saveState();
      }
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/the-backlog/sw.js?v=1790203198', { scope: '/the-backlog/' });
    });
    // A service worker update normally needs two reloads to actually become visible: the
    // first is still served by the outgoing worker while the new one installs in the
    // background, and the new content only shows up once that new worker actually takes
    // over. This auto-reloads the page exactly once, right when that handoff happens, so
    // one manual refresh is enough to see a new deploy instead of two.
    var refreshedForNewWorker = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshedForNewWorker) return;
      refreshedForNewWorker = true;
      location.reload();
    });
  }
</script>
