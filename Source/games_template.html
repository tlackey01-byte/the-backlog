        '<span class="add-game-result-text"><span class="add-game-result-name">' + escHtml(r.name) + '</span>' +
        (meta ? '<span class="add-game-result-meta">' + escHtml(meta) + '</span>' : '') +
        (inBacklog ? '<span class="in-backlog">' + icon('check', 14, 2.6) + 'In your backlog</span>' : (hours ? '<span class="add-game-result-hours">' + escHtml(hours) + '</span>' : '')) +
        '</span></button></li>';
    }).join('');
  }
  function runAddSearch() {
    var q = addQueryEl.value.trim();
    var seq = ++addSearchSeq;
    if (q.length < 3) { addResults = []; renderAddResults(); setAddStatus(''); return; }
    setAddStatus('Searching…');
    proxyFetch('/search?q=' + encodeURIComponent(q))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (seq !== addSearchSeq) return;
        addResults = data.results || [];
        addSearchSource = data.source;
        renderAddResults();
        if (!addResults.length) setAddStatus('No matches.');
        else if (data.source === 'sgdb') setAddStatus('HowLongToBeat is unavailable right now -- showing names only; you can enter hours yourself.', true);
        else setAddStatus('');
      })
      .catch(function(err) {
        if (seq !== addSearchSeq) return;
        setAddStatus(err.message || 'Search failed.', true);
      });
  }
  function renderAddPreview() {
    var p = addPreview, r = p.result;
    var cover = p.coverData ? '<img class="cover" src="' + p.coverData + '" alt="">'
      : '<span class="cover cover-ph" style="font-size:13px;font-family:var(--font-body);font-weight:500">' + (p.loading ? 'Loading…' : 'No cover') + '</span>';
    var hoursHtml = addSearchSource === 'sgdb'
      ? '<div class="card hltb add-hours">' + ['main', 'extra', 'completionist'].map(function(k, i) {
          return '<div><span class="lbl">' + ['Main', 'Main + extra', 'Completionist'][i] + '</span>' +
            '<input type="text" inputmode="decimal" data-hours="' + k + '" placeholder="hrs"></div>';
        }).join('') + '</div>'
      : '<div class="card hltb add-hours">' + [['Main story', r.main], ['Main + extra', r.extra], ['Completionist', r.completionist]].map(function(s) {
          return '<div><span class="num">' + fmtAddHours(s[1]) + '</span><span class="lbl">' + s[0] + '</span></div>';
        }).join('') + '</div>';
    var genres = p.loading ? '<span>Loading genres…</span>' : (p.genres.length ? p.genres.map(function(t) { return '<span>' + escHtml(t) + '</span>'; }).join('') : '<span>Genre unknown</span>');
    var statusChips = PROGRESS.map(function(s) { return fChip(s.label, p.progress === s.key, 'data-add-progress="' + s.key + '"', s.color); }).join('');
    var wish = p.platforms.indexOf('Wishlist') > -1;
    var platChips = fChip('Wishlist', wish, 'data-add-plat="Wishlist"', 'var(--wishlist)') +
      REAL_PLATFORMS.map(function(pl) { return fChip(pl.label, p.platforms.indexOf(pl.key) > -1, 'data-add-plat="' + pl.key + '"'); }).join('');
    addPreviewStepEl.innerHTML =
      '<div class="sheet-head" style="padding-left:8px"><button type="button" class="sort-btn" id="add-game-back" style="font-size:15px">' + icon('back', 20) + 'Results</button>' +
        '<button type="button" class="sheet-close" id="add-game-close-2" aria-label="Close">' + icon('x', 22) + '</button></div>' +
      '<div class="sheet-body">' +
        '<div class="add-preview-top">' + cover + '<div style="min-width:0">' +
          '<h4 class="add-preview-name">' + escHtml(r.name) + '</h4>' +
          '<div class="add-game-result-meta">' + escHtml([r.developer, r.year].filter(Boolean).join(' · ')) + '</div>' +
          '<div class="genre-tags">' + genres + '</div></div></div>' +
        hoursHtml +
        '<div class="sheet-section"><span class="mono-label">Status</span><div class="chip-row">' + statusChips + '</div></div>' +
        '<div class="sheet-section"><span class="mono-label">Platform</span><div class="chip-row">' + platChips + '</div></div>' +
        '<div class="add-game-status" id="add-game-save-status"></div>' +
      '</div>' +
      '<div class="sheet-foot"><button type="button" class="btn-block" id="add-game-save"' + (p.loading ? ' disabled' : '') + '>Add to backlog</button></div>';
  }
  function openAddPreview(r) {
    var seq = addSearchSeq;
    addPreview = { result: r, genres: [], coverData: null, steamAppId: null, loading: true, progress: 'backlog', platforms: ['Wishlist'] };
    addSearchStepEl.hidden = true;
    addPreviewStepEl.hidden = false;
    renderAddPreview();
    var qs = r.hltbId ? 'hltbId=' + r.hltbId : 'sgdbId=' + r.sgdbId;
    proxyFetch('/details?' + qs + '&name=' + encodeURIComponent(r.name) + '&year=' + encodeURIComponent(r.year || ''))
      .then(function(res) { return res.json(); })
      .then(function(d) {
        if (seq !== addSearchSeq || !addPreview) return;
        addPreview.genres = d.genres || [];
        addPreview.steamAppId = d.steamAppId || null;
        return d.coverUrl ? processCover(d.coverUrl).catch(function() { return null; }) : null;
      })
      .then(function(coverData) {
        if (seq !== addSearchSeq || !addPreview) return;
        addPreview.coverData = coverData || null;
        addPreview.loading = false;
        renderAddPreview();
      })
      .catch(function(err) {
        if (seq !== addSearchSeq || !addPreview) return;
        addPreview.loading = false;
        renderAddPreview();
        document.getElementById('add-game-save-status').textContent = 'Couldn’t load genres/cover (' + (err.message || 'error') + ') -- you can still add it.';
      });
  }
  function saveAddedGame() {
    var p = addPreview;
    if (!p) return;
    var r = p.result;
    var saveBtn = document.getElementById('add-game-save');
    var statusEl = document.getElementById('add-game-save-status');
    var real = p.platforms.filter(function(x) { return x !== 'Wishlist'; });
    var hours = { main: r.main, extra: r.extra, completionist: r.completionist };
    Array.prototype.forEach.call(addPreviewStepEl.querySelectorAll('[data-hours]'), function(el) {
      var v = parseFloat(el.value);
      hours[el.getAttribute('data-hours')] = isNaN(v) ? null : v;
    });
    // Re-adding something already in the catalog but deleted: restore it with the chosen
    // settings instead of creating a duplicate.
    var existing = findExistingGame(r.name);
    if (existing) {
      if (!existing.deleted) { statusEl.textContent = 'Already in your backlog.'; return; }
      delete deletedNames[existing.name];
      existing.deleted = false;
      existing.genres.forEach(function(tag) { genreCounts[tag] = (genreCounts[tag] || 0) + 1; });
      progressOverrides[existing.name] = existing.progress = p.progress;
      existing.playedHours = effectivePlayed(p.progress, existing.playedHoursDefault, existing.name);
      setPlatforms(existing, real);   // saves state
      rebuildGenreList();
      refreshStats();
      applyFilters();
      closeAddGameModal();
      location.hash = 'game-' + existing.id;
      return;
    }
    var rec = { n: r.name, m: hours.main, e: hours.extra, c: hours.completionist, o: real.length > 0, p: real, g: p.genres };
    if (p.progress !== 'backlog') rec.pr = p.progress;
    if (p.coverData) rec.cv = p.coverData;
    if (r.developer) rec.dv = r.developer;
    rec.addedAt = new Date().toISOString();
    if (r.hltbId) rec.hltbId = r.hltbId;
    if (p.steamAppId) rec.steamAppId = p.steamAppId;
    saveBtn.disabled = true;
    statusEl.textContent = 'Adding…';
    window.__addGameDoc(rec)
      .then(function() {
        // The snapshot listener usually beats this; applying locally too guarantees the
        // redirect below has the game to land on.
        applyAddedGames([rec]);
        closeAddGameModal();
        var g = gameByName[rec.n];
        if (g) location.hash = 'game-' + g.id;
      })
      .catch(function(err) {
        saveBtn.disabled = false;
        statusEl.textContent = 'Couldn’t save: ' + (err.message || err);
      });
  }
  document.getElementById('add-game-btn').addEventListener('click', openAddGameModal);
  addQueryEl.addEventListener('input', function() {
    clearTimeout(addSearchTimer);
    addSearchTimer = setTimeout(runAddSearch, 350);
  });
  document.getElementById('add-game-modal').addEventListener('click', function(e) {
    if (e.target.closest('#add-game-close') || e.target.closest('#add-game-close-2')) { closeAddGameModal(); return; }
    if (e.target.closest('#add-game-back')) { addSearchSeq++; showAddSearchStep(); return; }
    if (e.target.closest('#add-game-save')) { saveAddedGame(); return; }
    var pr = e.target.closest('[data-add-progress]');
    if (pr && addPreview) { addPreview.progress = pr.getAttribute('data-add-progress'); renderAddPreview(); return; }
    var pl = e.target.closest('[data-add-plat]');
    if (pl && addPreview) {
      var key = pl.getAttribute('data-add-plat');
      if (key === 'Wishlist') addPreview.platforms = ['Wishlist'];
      else {
        var next = addPreview.platforms.filter(function(x) { return x !== 'Wishlist'; });
        toggleIn(next, key);
        addPreview.platforms = next.length ? next : ['Wishlist'];
      }
      renderAddPreview();
      return;
    }
    var resultBtn = e.target.closest('.add-game-result');
    if (resultBtn && !resultBtn.disabled) openAddPreview(addResults[+resultBtn.getAttribute('data-i')]);
  });

  refreshStats();
  renderActiveChips();
  applyFilters();
  route();
})();
</script>

<script type="module">
  import { requireLogin, db, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy, signOutUser } from "../shared/firebase-init.js";
  document.getElementById("menu-signout").addEventListener("click", function () {
    signOutUser().then(function () { location.reload(); });
  });
  requireLogin(document.body, function (user) {
    document.getElementById("app").style.display = "";
    var stateRef = doc(db, "users", user.uid, "state", "games");
    // Called by saveState() in the classic script above, which owns the state shape.
    // Always a full overwrite (see the dotted-key comment near buildStateObject()).
    window.__cloudSaveState = function (stateObj) {
      var payload = Object.assign({}, stateObj, { updatedAt: new Date().toISOString() });
      return setDoc(stateRef, payload);
    };

    // Games added from the site (see applyAddedGames() in the classic script). One doc per
    // game so covers never bloat the state doc above, which is fully rewritten on every edit.
    var addedGamesCol = collection(db, "users", user.uid, "addedGames");
    window.__addGameDoc = function (rec) { return addDoc(addedGamesCol, rec); };
    // Firebase ID token for the backlog proxy Worker, which only answers this one user.
    window.__getIdToken = function () { return user.getIdToken(); };
    onSnapshot(query(addedGamesCol, orderBy("addedAt")), function (snap) {
      if (window.__applyAddedGames) window.__applyAddedGames(snap.docs.map(function (d) { return d.data(); }));
    });

    // Live cross-device sync: every snapshot (this device's own writes echoing back
    // included) is diffed and patched into the page by applyRemoteState(), never a full
    // reload. Also re-saves `totals` once per page load so the homepage card self-heals
    // after anything writes this doc without recomputing them.
    var seededTotals = false;
    onSnapshot(stateRef, function (snap) {
      var data = snap.data();
      if (window.__applyRemoteState) window.__applyRemoteState(data);
      if (!seededTotals) {
        seededTotals = true;
        if (window.saveState) window.saveState();
      }
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/the-backlog/sw.js?v=1790025732', { scope: '/the-backlog/' });
    });
    // A service worker update normally needs two reloads to actually become visible: the
    // first is still served by the outgoing worker while the new one installs in the
    // background, and the new content only shows up once that new worker actually takes
    // over. This auto-reloads the page exactly once, right when that handoff happens, so
    // one manual refresh is enough to see a new deploy instead of two.
    var refreshedForNewWorker = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshedForNewWorker) return;
      refreshedForNewWorker = true;
      location.reload();
    });
  }
</script>
